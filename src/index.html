<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Orbitron', monospace;
            color: #00ffff;
        }

        /* ===== CANVAS CONTAINER ===== */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* ===== PLANET TOOLTIP - GAMING STYLE ===== */
        .planet-tooltip {
            position: fixed;
            background: linear-gradient(145deg, rgba(0, 20, 40, 0.95) 0%, rgba(0, 40, 80, 0.9) 100%);
            border: 1px solid #00ffff;
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(20px);
            box-shadow: 
                0 0 25px rgba(0, 255, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 8px 32px rgba(0, 0, 0, 0.3);
            min-width: 280px;
            max-width: 320px;
            z-index: 1002;
            opacity: 0;
            transform: scale(0.9) translateY(15px);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            pointer-events: none;
            font-size: 0.9rem;
        }

        /* Ligne de connexion vers la planète */
        .planet-tooltip::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 60px;
            background: linear-gradient(to bottom, #00ffff, transparent);
            left: 50%;
            bottom: 100%;
            transform: translateX(-50%);
            opacity: 0.6;
        }

        .planet-tooltip.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .tooltip-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            position: relative;
        }

        .tooltip-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 30%;
            height: 1px;
            background: #00ffff;
            box-shadow: 0 0 5px #00ffff;
        }

        .tooltip-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .tooltip-icon::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shine 3s ease-in-out infinite;
        }

        .tooltip-title {
            flex: 1;
        }

        .tooltip-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #00ffff;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        .tooltip-type {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            color: #0080ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .tooltip-close {
            width: 24px;
            height: 24px;
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: 6px;
            color: #ff6b9d;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .tooltip-close:hover {
            background: rgba(255, 51, 102, 0.2);
            border-color: #ff3366;
            color: #ff3366;
            transform: scale(1.1);
        }

        .tooltip-content {
            display: grid;
            gap: 8px;
            margin-bottom: 10px;
        }

        .tooltip-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 6px;
            border-left: 2px solid rgba(0, 255, 255, 0.3);
            transition: all 0.2s ease;
        }

        .tooltip-info:hover {
            background: rgba(0, 255, 255, 0.1);
            border-left-color: #00ffff;
        }

        .info-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            color: #0080ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .info-value {
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            color: #00ffff;
            font-weight: 700;
            text-align: right;
        }

        .tooltip-description {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            line-height: 1.3;
            color: #80c0ff;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .center-btn, .stop-follow-btn, .more-info-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .center-btn {
            background: linear-gradient(45deg, #ff6b00, #ffaa00);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.3);
        }

        .center-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 30px rgba(255, 107, 0, 0.6);
        }

        .stop-follow-btn {
            background: linear-gradient(45deg, #ff3366, #ff6b9d);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.3);
        }

        .stop-follow-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 30px rgba(255, 51, 102, 0.6);
        }

        .more-info-btn {
            background: linear-gradient(45deg, #00ffff, #0080ff);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .more-info-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 30px rgba(0, 255, 255, 0.6);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes pulse {
            0%, 100% { 
                opacity: 1; 
                transform: scale(1);
            }
            50% { 
                opacity: 0.7; 
                transform: scale(1.05);
            }
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        /* Gaming glow effect */
        .center-btn::before, .stop-follow-btn::before, .more-info-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .center-btn:hover::before, .stop-follow-btn:hover::before, .more-info-btn:hover::before {
            left: 100%;
        }

        /* ===== SETTINGS SIDEBAR ===== */
        .settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100vh;
            background: linear-gradient(145deg, rgba(0, 20, 40, 0.95) 0%, rgba(0, 40, 80, 0.9) 100%);
            border-right: 2px solid #00ffff;
            backdrop-filter: blur(20px);
            box-shadow: 2px 0 30px rgba(0, 255, 255, 0.3);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 1001;
            overflow: hidden;
            transform: translateX(0);
        }

        .settings-panel.hidden {
            transform: translateX(-100%);
        }

        /* Bouton toggle pour afficher la sidebar - COIN HAUT GAUCHE */
        .sidebar-toggle-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, rgba(0, 10, 30, 0.98) 0%, rgba(0, 30, 60, 0.95) 100%);
            border: 2px solid #00ffff;
            border-radius: 12px;
            backdrop-filter: blur(25px);
            box-shadow: 
                0 0 25px rgba(0, 255, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 8px 32px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
        }

        .sidebar-toggle-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .sidebar-toggle-button:hover::before {
            left: 100%;
        }

        .sidebar-toggle-button:hover {
            background: linear-gradient(145deg, rgba(0, 30, 60, 0.98) 0%, rgba(0, 50, 100, 0.95) 100%);
            border-color: #00ddff;
            box-shadow: 
                0 0 35px rgba(0, 255, 255, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 12px 40px rgba(0, 0, 0, 0.4);
            transform: scale(1.08) rotate(2deg);
        }

        .sidebar-toggle-button .toggle-icon {
            font-size: 24px;
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease;
            z-index: 1;
        }

        .sidebar-toggle-button:hover .toggle-icon {
            color: #ffffff;
            text-shadow: 
                0 0 15px rgba(0, 255, 255, 0.8),
                0 0 25px rgba(0, 255, 255, 0.4);
            transform: scale(1.1);
        }

        .sidebar-toggle-button.visible {
            display: flex;
            animation: slideInFromLeft 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Animation d'apparition du bouton */
        @keyframes slideInFromLeft {
            from {
                transform: translateX(-100px) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        /* Effet de pulsation subtile */
        .sidebar-toggle-button.visible {
            animation: slideInFromLeft 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                       subtlePulse 3s ease-in-out infinite 1s;
        }

        @keyframes subtlePulse {
            0%, 100% {
                box-shadow: 
                    0 0 25px rgba(0, 255, 255, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1),
                    0 8px 32px rgba(0, 0, 0, 0.3);
            }
            50% {
                box-shadow: 
                    0 0 30px rgba(0, 255, 255, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.15),
                    0 10px 35px rgba(0, 0, 0, 0.35);
            }
        }

        .settings-toggle {
            position: absolute;
            right: -50px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 100px;
            background: linear-gradient(145deg, rgba(0, 20, 40, 0.95) 0%, rgba(0, 40, 80, 0.9) 100%);
            border: 1px solid #00ffff;
            border-left: none;
            border-radius: 0 15px 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(20px);
            box-shadow: 2px 0 15px rgba(0, 255, 255, 0.4);
        }

        .settings-toggle:hover {
            background: linear-gradient(145deg, rgba(0, 40, 80, 0.95) 0%, rgba(0, 80, 120, 0.9) 100%);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .toggle-icon {
            font-size: 1.2rem;
            animation: pulse 2s ease-in-out infinite;
            margin-bottom: 8px;
        }

        .toggle-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .settings-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            background: rgba(0, 255, 255, 0.05);
        }

        .settings-header h3 {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .settings-body {
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-label {
            display: block;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: #0080ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .setting-slider {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-slider input[type="range"] {
            flex: 1;
            height: 4px;
            background: rgba(0, 128, 255, 0.2);
            border: none;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .setting-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #00ffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            transition: all 0.2s ease;
        }

        .setting-slider input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .slider-value {
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            color: #00ffff;
            font-weight: 700;
            min-width: 40px;
            text-align: right;
        }

        .setting-toggles {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .setting-toggle-btn {
            padding: 6px 12px;
            background: rgba(0, 128, 255, 0.1);
            border: 1px solid rgba(0, 128, 255, 0.3);
            border-radius: 6px;
            color: #0080ff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .setting-toggle-btn:hover {
            background: rgba(0, 128, 255, 0.2);
            border-color: #0080ff;
        }

        .setting-toggle-btn.active {
            background: #00ffff;
            color: #000;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        /* ===== SCALE DISPLAY ===== */
        .scale-display {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 280px;
            background: linear-gradient(145deg, rgba(0, 20, 40, 0.95) 0%, rgba(0, 40, 80, 0.9) 100%);
            border: 1px solid #00ffff;
            border-radius: 12px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            z-index: 1000;
            font-family: 'Rajdhani', sans-serif;
        }

        .scale-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            background: rgba(0, 255, 255, 0.05);
        }

        .scale-icon {
            font-size: 1.1rem;
        }

        .scale-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scale-info {
            padding: 15px;
        }

        .scale-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 10px;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 6px;
            border-left: 2px solid rgba(0, 255, 255, 0.3);
        }

        .scale-item:last-child {
            margin-bottom: 0;
        }

        .scale-label {
            font-size: 0.8rem;
            color: #0080ff;
            font-weight: 600;
        }

        .scale-value {
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            color: #00ffff;
            font-weight: 700;
            text-align: right;
        }
    </style>
</head>
<body>
    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Scale and Distance Display -->
    <div id="scale-display" class="scale-display">
        <div class="scale-header">
            <span class="scale-icon">📏</span>
            <span class="scale-title">ÉCHELLE & DISTANCE</span>
        </div>
        <div class="scale-info">
            <div class="scale-item">
                <span class="scale-label">Distance caméra:</span>
                <span class="scale-value" id="camera-distance">0 km</span>
            </div>
            <div class="scale-item">
                <span class="scale-label">Échelle:</span>
                <span class="scale-value" id="scale-ratio">1:1</span>
            </div>
            <div class="scale-item" id="target-distance-item" style="display: none;">
                <span class="scale-label">Distance à l'objet:</span>
                <span class="scale-value" id="target-distance">0 km</span>
            </div>
        </div>
    </div>

    <!-- Bouton Toggle Sidebar -->
    <button id="sidebar-toggle-btn" class="sidebar-toggle-button">
        <span class="toggle-icon">≡</span>
    </button>

    <!-- Settings Panel -->
    <div id="settings-panel" class="settings-panel">
        <div class="settings-toggle" id="settings-toggle">
            <span class="toggle-icon">⚙️</span>
            <span class="toggle-text">PARAMÈTRES</span>
        </div>
        <div class="settings-content">
            <div class="settings-header">
                <h3>PARAMÈTRES</h3>
            </div>
            <div class="settings-body">
                <div class="setting-group">
                    <label class="setting-label">VITESSE ORBITALE</label>
                    <div class="setting-slider">
                        <input type="range" id="orbit-speed-setting" min="0" max="5" value="1" step="0.1">
                        <span class="slider-value" id="orbit-speed-value">1.0x</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label class="setting-label">VITESSE ROTATION</label>
                    <div class="setting-slider">
                        <input type="range" id="rotation-speed-setting" min="0" max="5" value="1" step="0.1">
                        <span class="slider-value" id="rotation-speed-value">1.0x</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label class="setting-label">VITESSE ANIMATION</label>
                    <div class="setting-slider">
                        <input type="range" id="animation-speed-setting" min="0.1" max="3" value="1" step="0.1">
                        <span class="slider-value" id="animation-speed-value">1.0x</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label class="setting-label">ÉCHELLE NASA</label>
                    <div class="setting-slider">
                        <input type="range" id="scale-factor-setting" min="0.1" max="10" value="1" step="0.1">
                        <span class="slider-value" id="scale-factor-value">1.0 UA/unité</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label class="setting-label">AFFICHAGE</label>
                    <div class="setting-toggles">
                        <button class="setting-toggle-btn active" id="show-orbits-btn">ORBITES</button>
                        <button class="setting-toggle-btn active" id="show-labels">LABELS</button>
                        <button class="setting-toggle-btn active" id="show-moons">LUNES</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Planet Tooltip (Hidden by default) -->
    <div id="planet-tooltip" class="planet-tooltip">
        <div class="tooltip-header">
            <div class="tooltip-icon">🪐</div>
            <div class="tooltip-title">
                <div class="tooltip-name" id="tooltip-name">Planète</div>
                <div class="tooltip-type" id="tooltip-type">Objet Céleste</div>
            </div>
            <button class="tooltip-close" id="tooltip-close">×</button>
        </div>
        
        <div class="tooltip-content" id="tooltip-content">
            <!-- Content will be dynamically generated -->
        </div>
        
        <div class="tooltip-description" id="tooltip-description">
            <!-- Description will be dynamically generated -->
        </div>
        
        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <button class="center-btn" id="center-btn">
                🎯 Centrer
            </button>
            <button class="stop-follow-btn" id="stop-follow-btn" style="display: none;">
                🔓 Libérer
            </button>
            <button class="more-info-btn" id="more-info-btn">
                En savoir plus
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="./script.js"></script>
    
    <script>
        // Gestion du toggle de la sidebar
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('settings-panel');
            const toggleBtn = document.getElementById('sidebar-toggle-btn');
            const canvas = document.getElementById('canvas-container');
            
            let sidebarVisible = true;
            
            // Fonction pour masquer la sidebar
            function hideSidebar() {
                if (!sidebarVisible) return;
                sidebar.classList.add('hidden');
                toggleBtn.classList.add('visible');
                sidebarVisible = false;
                console.log('🔒 Sidebar masquée');
            }
            
            // Fonction pour afficher la sidebar
            function showSidebar() {
                if (sidebarVisible) return;
                sidebar.classList.remove('hidden');
                toggleBtn.classList.remove('visible');
                sidebarVisible = true;
                console.log('🔓 Sidebar affichée');
            }
            
            // Clic sur le bouton toggle
            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                showSidebar();
            });
            
            // Clic sur le canvas pour masquer
            if (canvas) {
                canvas.addEventListener('click', function(e) {
                    if (sidebarVisible) {
                        hideSidebar();
                    }
                });
            }
            
            // Empêcher la propagation des clics dans la sidebar
            sidebar.addEventListener('click', function(e) {
                e.stopPropagation();
            });
            
            // Raccourci clavier Echap pour masquer
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sidebarVisible) {
                    hideSidebar();
                }
            });
            
            console.log('✅ Sidebar toggle initialisé');
        });
    </script>
</body>
</html>
